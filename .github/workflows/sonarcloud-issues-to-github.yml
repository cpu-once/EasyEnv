name: SonarCloud issues -> GitHub Issues

# decision-14: SonarCloud에 이슈를 GitHub Issues로 내보내는 네이티브 기능이 없어서
# (2026-09-04 확인), REST API로 열린 이슈를 가져와 직접 발행한다. 이건 SonarCloud
# 발견물 전용의 좁은 파이프라인이다 - decision-9(태스크 관리는 backlog.md만 씀)를
# 뒤집는 게 아니다. backlog task/decision을 GitHub Issues로 옮기거나 그 반대로 옮기는
# 워크플로는 여전히 없다.
#
# workflow_run(sonarcloud.yml 완료 시 바로 트리거)이 아니라 매일 스케줄을 쓴다 —
# (1) SonarCloud의 이슈 인덱스가 스캔 job 자체의 완료 시점보다 늦게 갱신될 수 있어서
# 방금 끝난 스캔 결과를 못 읽는 경합 위험이 있고, (2) push마다 바로 이슈가 뜨면 알림이
# 너무 잦아진다("알림폭탄") - 하루 한 번 모아서 동기화하는 쪽을 택함. 스케줄은
# "지금 시점에 열려있는 걸 전부 동기화"라서 그 경합도 자연히 피한다.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: sync SonarCloud issues to GitHub Issues
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the sonarcloud label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sonarcloud \
            --repo "${{ github.repository }}" \
            --color FF6A00 \
            --description "Auto-published from SonarCloud (decision-14)" \
            || true

      - name: Fetch open SonarCloud issues and publish missing ones as GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -eu
          org="amosqp"
          project="amosQP_langtoolchain"
          page=1
          page_size=100

          while :; do
            if [ -n "${SONAR_TOKEN:-}" ]; then
              response="$(curl -fsS -u "${SONAR_TOKEN}:" \
                "https://sonarcloud.io/api/issues/search?organization=${org}&componentKeys=${project}&resolved=false&ps=${page_size}&p=${page}")"
            else
              response="$(curl -fsS \
                "https://sonarcloud.io/api/issues/search?organization=${org}&componentKeys=${project}&resolved=false&ps=${page_size}&p=${page}")"
            fi

            total="$(printf '%s' "$response" | jq -r '.paging.total')"
            count="$(printf '%s' "$response" | jq '.issues | length')"

            printf '%s' "$response" | jq -c '.issues[]' | while IFS= read -r issue; do
              key="$(printf '%s' "$issue" | jq -r '.key')"
              rule="$(printf '%s' "$issue" | jq -r '.rule')"
              message="$(printf '%s' "$issue" | jq -r '.message')"
              component="$(printf '%s' "$issue" | jq -r '.component')"
              line="$(printf '%s' "$issue" | jq -r '.line // "?"')"
              severity="$(printf '%s' "$issue" | jq -r '.severity')"

              existing="$(gh issue list --repo "${{ github.repository }}" \
                --label sonarcloud --state all --search "\"${key}\" in:body" \
                --json number --jq 'length')"
              if [ "$existing" -gt 0 ]; then
                continue
              fi

              title="[SonarCloud] ${rule}: ${message}"
              tmp_body="$(mktemp)"
              {
                printf 'SonarCloud에서 발견된 이슈입니다 (decision-14 파이프라인으로 자동 발행 - backlog\n'
                printf '태스크가 아닙니다, SonarCloud 코드 품질 발견물 전용 알림입니다).\n\n'
                printf -- '- **파일**: `%s`:%s\n' "${component#*:}" "$line"
                printf -- '- **룰**: %s\n' "$rule"
                printf -- '- **심각도**: %s\n' "$severity"
                printf -- '- **SonarCloud 이슈 key**: `%s`\n\n' "$key"
                printf '[SonarCloud에서 보기](https://sonarcloud.io/project/issues?id=%s&issues=%s&open=%s)\n' \
                  "$project" "$key" "$key"
              } > "$tmp_body"
              gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body-file "$tmp_body" --label sonarcloud
              rm -f "$tmp_body"
            done

            pages="$(( (total + page_size - 1) / page_size ))"
            if [ "$pages" -le 0 ] || [ "$page" -ge "$pages" ] || [ "$count" -eq 0 ]; then
              break
            fi
            page=$((page + 1))
          done

      - name: Close GitHub Issues whose SonarCloud issue is resolved
        # decision-18: 발행 방향(위 step)은 그대로 두고, 이미 발행된 label:sonarcloud
        # 이슈 중 SonarCloud 쪽에서 해소된 것을 찾아 close한다. 본문에서 key를 못
        # 뽑으면(사람이 본문을 고쳤거나 패턴이 없는 경우) 추측하지 않고 조용히 skip한다.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -eu
          org="amosqp"
          project="amosQP_langtoolchain"

          gh issue list --repo "${{ github.repository }}" \
            --label sonarcloud --state open --json number,body \
            | jq -c '.[]' | while IFS= read -r issue; do
              number="$(printf '%s' "$issue" | jq -r '.number')"
              body="$(printf '%s' "$issue" | jq -r '.body')"

              key="$(printf '%s' "$body" \
                | grep -oE "\\*\\*SonarCloud 이슈 key\\*\\*: \`[^\`]+\`" \
                | sed -E "s/.*\`([^\`]+)\`.*/\\1/")"
              if [ -z "$key" ]; then
                # key를 본문에서 찾지 못함 - 추측으로 닫지 않고 skip (decision-18)
                continue
              fi

              if [ -n "${SONAR_TOKEN:-}" ]; then
                response="$(curl -fsS -u "${SONAR_TOKEN}:" \
                  "https://sonarcloud.io/api/issues/search?organization=${org}&componentKeys=${project}&issues=${key}")" || continue
              else
                response="$(curl -fsS \
                  "https://sonarcloud.io/api/issues/search?organization=${org}&componentKeys=${project}&issues=${key}")" || continue
              fi

              status="$(printf '%s' "$response" | jq -r '.issues[0].status // empty')"
              resolution="$(printf '%s' "$response" | jq -r '.issues[0].resolution // empty')"

              if [ "$status" != "CLOSED" ]; then
                continue
              fi

              tmp_comment="$(mktemp)"
              {
                printf 'SonarCloud에서 이 이슈가 해소된 것으로 확인되어 자동으로 close합니다\n'
                printf '(decision-18 파이프라인 - close 방향 동기화).\n\n'
                printf -- '- **SonarCloud status**: `%s`\n' "$status"
                printf -- '- **SonarCloud resolution**: `%s`\n' "${resolution:-N/A}"
                printf -- '- **SonarCloud 이슈 key**: `%s`\n' "$key"
              } > "$tmp_comment"
              if ! gh issue comment "$number" --repo "${{ github.repository }}" --body-file "$tmp_comment"; then
                rm -f "$tmp_comment"
                continue
              fi
              rm -f "$tmp_comment"

              gh issue close "$number" --repo "${{ github.repository }}" || continue
            done
